name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Backend (${{ matrix.nombre }})
    runs-on: ${{ matrix.so }}

    # Los tres sistemas a la vez: un fallo en uno no debe ocultar los otros.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nombre: Linux, so: ubuntu-latest }
          - { nombre: macOS, so: macos-latest }
          - { nombre: Windows, so: windows-latest }

    steps:
      - uses: actions/checkout@v4

      # El crate `tauri` enlaza contra webkit2gtk vía pkg-config, así que las
      # cabeceras de desarrollo hacen falta incluso para `cargo check`.
      - name: Instalar dependencias de sistema de Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.so }}

      # El formato no depende del sistema: basta con mirarlo una vez.
      - name: Formato
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test

  frontend:
    name: Frontend (${{ matrix.nombre }})
    runs-on: ${{ matrix.so }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { nombre: Linux, so: ubuntu-latest }
          - { nombre: macOS, so: macos-latest }
          - { nombre: Windows, so: windows-latest }

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Tipos y plantillas
        run: pnpm check

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
