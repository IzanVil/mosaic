<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mosaic</title>
    <!-- El tema guardado vive en SQLite y llega tarde; esta copia en localStorage evita pintar un fotograma con el otro tema. -->
    <script>
      (function () {
        var mode = 'dark';
        try {
          mode = localStorage.getItem('mosaic.theme') || 'dark';
        } catch (e) {}
        var dark =
          mode === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : mode !== 'light';
        var root = document.documentElement;
        root.classList.toggle('dark', dark);
        root.classList.toggle('light', !dark);
        root.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
